                <div className="min-w-0 bg-gradient-to-br from-white via-blue-50/25 to-emerald-50/25 p-4 sm:p-6">
                  <${ReportPanel} t=${t} progress=${progress} />
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function DemoSection({ t }) {
        return html`
          <section id="demo" className="overflow-hidden px-4 py-22 sm:px-6 sm:py-28 lg:px-8">
            <div className="mx-auto max-w-7xl">
              <${Reveal}>
                <${SectionHeading} eyebrow=${t.demo.eyebrow} title=${t.demo.title} description=${t.demo.description} centered=${true} />
              <//>
              <${Reveal} className="mt-12" delay=${0.08}>
                <${DemoDashboard} t=${t} />
              <//>
            </div>
          </section>
        `;
      }

      function Cta({ t }) {
        const [copied, setCopied] = useState(false);
        const copyCommand = async () => {
          try {
            await navigator.clipboard.writeText(CLONE_COMMAND);
          } catch {
            const input = document.createElement("textarea");
            input.value = CLONE_COMMAND;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            input.remove();
          }
          setCopied(true);
          window.setTimeout(() => setCopied(false), 2200);
        };

        return html`
          <section className="px-4 pb-22 sm:px-6 sm:pb-28 lg:px-8">
            <${Reveal} className="mx-auto max-w-7xl">
              <div className="relative isolate overflow-hidden rounded-[2rem] border border-blue-200 bg-gradient-to-br from-blue-50 via-white to-emerald-50 p-6 shadow-[0_30px_80px_rgba(37,99,235,.12)] sm:p-10 lg:p-14">
                <div className="grid-surface pointer-events-none absolute inset-0 -z-20 opacity-70"></div>
                <div className="pointer-events-none absolute right-[-7rem] top-[-8rem] -z-10 h-72 w-72 rounded-full bg-cyan-200/45 blur-3xl"></div>
                <div className="grid items-end gap-10 lg:grid-cols-[1fr_.85fr]">
                  <div>
                    <p className="text-xs font-extrabold tracking-[0.16em] text-blue-700 uppercase">${t.cta.eyebrow}</p>
                    <h2 className="mt-4 max-w-3xl text-balance text-3xl font-black tracking-[-0.045em] text-slate-950 sm:text-4xl lg:text-5xl">${t.cta.title}</h2>
                    <p className="mt-5 max-w-2xl text-base leading-7 text-slate-600">${t.cta.description}</p>
                    <div className="mt-8 flex flex-col gap-3 sm:flex-row">
                      <a href=${GITHUB_URL} target="_blank" rel="noreferrer" className="focusable inline-flex min-h-12 items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 text-sm font-extrabold text-white shadow-[0_12px_28px_rgba(37,99,235,.22)] transition duration-200 hover:bg-blue-700">
                        <${Github} size=${18} aria-hidden="true" /> ${t.cta.github}
                      </a>
                      <a href=${DOCS_URL} target="_blank" rel="noreferrer" className="focusable inline-flex min-h-12 items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white/85 px-5 text-sm font-extrabold text-slate-800 shadow-sm transition duration-200 hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700">
                        <${Clipboard} size=${17} aria-hidden="true" /> ${t.cta.docs}
                      </a>
                    </div>
                  </div>
                  <div>
                    <p className="mb-2 text-xs font-extrabold tracking-[0.1em] text-slate-600 uppercase">${t.cta.cloneLabel}</p>
                    <div className="rounded-2xl border border-slate-200 bg-white/90 p-2 shadow-sm backdrop-blur">
                      <div className="flex min-w-0 items-center gap-2 rounded-xl bg-slate-50 px-3 py-2">
                        <${Terminal} className="shrink-0 text-blue-700" size=${17} aria-hidden="true" />
                        <code className="min-w-0 flex-1 overflow-x-auto whitespace-nowrap py-2 font-mono text-xs font-bold text-slate-700 sm:text-sm">${CLONE_COMMAND}</code>
                        <button type="button" onClick=${copyCommand} className="focusable inline-flex min-h-11 shrink-0 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-xs font-extrabold text-slate-700 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700" aria-label=${copied ? t.cta.copied : t.cta.copy}>
                          ${copied
                            ? html`<${Check} size=${16} color="#059669" aria-hidden="true" /> <span className="hidden sm:inline">${t.cta.copied}</span>`
                            : html`<${Copy} size=${16} aria-hidden="true" /> <span className="hidden sm:inline">${t.cta.copy}</span>`}
                        </button>
                      </div>
                    </div>
                    <div className="mt-4 flex flex-wrap gap-2">
                      <span className="rounded-full border border-blue-100 bg-blue-50 px-3 py-1.5 text-[11px] font-bold text-blue-700">${t.cta.stack[0]}</span>
                      <span className="rounded-full border border-cyan-100 bg-cyan-50 px-3 py-1.5 text-[11px] font-bold text-cyan-700">${t.cta.stack[1]}</span>
                      <span className="rounded-full border border-emerald-100 bg-emerald-50 px-3 py-1.5 text-[11px] font-bold text-emerald-700">${t.cta.stack[2]}</span>
                    </div>
                  </div>
                </div>
                <span className="sr-only" aria-live="polite">${copied ? t.cta.copied : ""}</span>
              </div>
            <//>
          </section>
        `;
      }

      function Footer({ t }) {
        return html`
          <footer className="border-t border-slate-200 bg-white px-4 py-10 sm:px-6 lg:px-8">
            <div className="mx-auto flex max-w-7xl flex-col gap-7 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <${Logo} t=${t} />
                <p className="mt-3 max-w-md text-sm leading-6 text-slate-500">${t.footer.summary}</p>
              </div>
              <div className="flex flex-wrap items-center gap-x-5 gap-y-3 text-xs font-bold text-slate-500">
                <span className="inline-flex items-center gap-2"><${ShieldCheck} size=${15} color="#d97706" aria-hidden="true" />${t.footer.research}</span>
                <a href=${GITHUB_URL} target="_blank" rel="noreferrer" className="focusable inline-flex min-h-11 items-center gap-2 rounded-lg text-slate-600 transition hover:text-blue-700"><${Github} size=${15} aria-hidden="true" />${t.footer.openSource}</a>
              </div>
            </div>
          </footer>
        `;
      }

      function App() {
        const [lang, setLang] = useState("en");
        const t = useMemo(() => translations[lang], [lang]);

        useEffect(() => {
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = t.metaTitle;
        }, [lang, t.metaTitle]);

        return html`
          <${Navbar} t=${t} lang=${lang} setLang=${setLang} />
          <main id="main">
            <${Hero} t=${t} />
            <${Features} t=${t} />
            <${DemoSection} t=${t} />
            <${Cta} t=${t} />
          </main>
          <${Footer} t=${t} />
        `;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
