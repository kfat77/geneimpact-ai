[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geneimpact-ai"
version = "1.1.0"
description = "Evidence-aware animal genome-edit impact assessment research tooling."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GeneImpact AI contributors"}]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "xlwt>=1.3,<2"]

[project.scripts]
geneimpact = "geneimpact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geneimpact"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
